<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!--meta-->
    <meta name="theme-color" content="#fbf3e4">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="alternate" type="application/rss+xml" title="In cucina con Andrea" href="/feed.xml">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/views.css">
    <script src="/js/theme-init.js"></script>
</head>
<body>
    <a class="skip-link" href="#app">Vai al contenuto</a>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="cursor" id="cursor" aria-hidden="true"><span class="cursor__dot"></span><span class="cursor__ring"></span></div>

    <header class="site-header" id="header">
        <a class="brand" href="/" data-link aria-label="In cucina con Andrea, home">
            <span class="brand__mark" aria-hidden="true">🍳</span>
            <span class="brand__text">In cucina con <em>Andrea</em></span>
        </a>
        <nav class="nav" id="nav" aria-label="Principale">
            <a href="/" data-link data-nav="/">Ricette</a>
            <a href="/preferiti" data-link data-nav="/preferiti">Preferiti <span class="badge" id="fav-count" hidden>0</span></a>
            <a href="/chi-sono" data-link data-nav="/chi-sono">Chi sono</a>
        </nav>
        <div class="tools">
            <button class="icon-btn" id="btn-sound" type="button" aria-pressed="false" aria-label="Attiva i suoni" title="Suoni (M)">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="ico-on" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5zM14.5 4.3v2.1a7 7 0 0 1 0 11.2v2.1a9 9 0 0 0 0-15.4z" fill="currentColor"/><path class="ico-off" d="M4 9v6h4l5 4V5L8 9H4zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z" fill="currentColor"/></svg>
            </button>
            <button class="icon-btn" id="btn-theme" type="button" aria-label="Cambia tema" title="Tema (T)">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="ico-moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/><g class="ico-sun" fill="currentColor"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g></svg>
            </button>
            <button class="icon-btn menu-btn" id="btn-menu" type="button" aria-label="Apri il menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main id="app" tabindex="-1">
        <noscript><p class="noscript">Questo blog usa JavaScript per mostrare le ricette. Attivalo per continuare. 🍝</p></noscript>
    </main>

    <footer class="site-footer">
        <p>© <span id="year"></span> In cucina con Andrea · fatto con 🔥 e olio buono</p>
        <p class="site-footer__links">
            <a href="/feed.xml">RSS</a>
            <a href="/admin" data-link>Area autore</a>
            <button type="button" class="link-btn" id="btn-top">Torna su ↑</button>
        </p>
    </footer>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
